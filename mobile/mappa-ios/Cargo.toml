[package]
name = "mappa-ios"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18"] }

[[bin]]
name = "mappa-ios"
path = "src/main.rs"

[[bin]]
name = "ios-build"
path = "src/bin/ios-build.rs"

[target.'cfg(target_os = "ios")'.dependencies]
mappa-apple = { path = "../../crates/mappa-apple" }
mappa-client-core = { path = "../../crates/mappa-client-core" }
mappa-client-runtime = { path = "../../crates/mappa-client-runtime" }
mappa-client-transport = { path = "../../crates/mappa-client-transport" }
mappa-device = { path = "../../crates/mappa-device" }
mappa-spatial = { path = "../../crates/mappa-spatial" }
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-skia"] }
tokio.workspace = true
