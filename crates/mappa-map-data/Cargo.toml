[package]
name = "mappa-map-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mappa-map-core = { path = "../mappa-map-core" }
thiserror.workspace = true
pmtiles = { version = "0.24.0", default-features = false, features = ["mmap-async-tokio", "write"] }
mvt-reader = "2.5.0"
geo = { version = "0.33.1", default-features = false }
geojson = "1.0.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.12"
sha2 = "0.10.9"
bincode = "1.3.3"
memmap2 = "0.9"
rstar = "0.12.2"
mvt = "0.15.0"
tokio.workspace = true
mlt-core = { version = "0.14.5", optional = true, default-features = false }
flate2 = "1.1.10"
shapefile = "0.9.0"
zip = { version = "1.1.4", default-features = false, features = ["deflate"] }

[features]
mlt-eval = ["dep:mlt-core"]

[[bin]]
name = "compare_formats"
path = "src/bin/compare_formats.rs"
required-features = ["mlt-eval"]
